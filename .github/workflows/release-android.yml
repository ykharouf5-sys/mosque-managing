name: Android release bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          cache: true
      - name: Validate release configuration
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          test -n "$API_BASE_URL"
          echo "$API_BASE_URL" | grep -Eq '^https://[^/]+/.+'
          test -n "$KEYSTORE_B64"
          test -n "$GOOGLE_SERVICES_B64"
      - name: Restore signing and Firebase files
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
        run: |
          mkdir -p android/keystores
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/keystores/studentry-upload.jks
          printf '%s' "$GOOGLE_SERVICES_B64" | base64 --decode > android/app/google-services.json
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=../keystores/studentry-upload.jks\n' \
            "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - name: Build signed app bundle
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: flutter build appbundle --release --dart-define=API_BASE_URL="$API_BASE_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: studentry-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
